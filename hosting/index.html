<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gamer's Vault - Conectar ao VaultCast</title>
  <link rel="icon" href="https://raw.githubusercontent.com/Felipe-G03/GamerVault/main/public/icon.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #07080c;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #0f121a;
      border: 1px solid #232738;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.9), 0 0 35px rgba(16,185,129,0.15);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.4);
      color: #fb7185;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f43f5e;
      box-shadow: 0 0 8px #f43f5e;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 10px; letter-spacing: -0.5px; }
    p { color: #9ca3af; font-size: 13px; line-height: 1.6; margin-bottom: 28px; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: #10b981;
      color: #000;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(16,185,129,0.3);
    }
    .btn:hover { background: #34d399; transform: translateY(-1px); }
    .secondary {
      display: inline-block;
      margin-top: 18px;
      color: #6b7280;
      font-size: 12px;
      text-decoration: none;
      transition: color 0.2s;
    }
    .secondary:hover { color: #10b981; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge"><span class="dot"></span> VaultCast Ao Vivo</div>
    <h1>Abrindo no Gamer's Vault</h1>
    <p>Estamos conectando você à transmissão ao vivo na guilda.</p>
    <a id="launch-btn" class="btn" href="#">Abrir Gamer's Vault</a>
    <a class="secondary" href="https://www.dropbox.com/scl/fi/qn91m2u5rdxyogx4l2zbm/Gamer-s-Vault-Setup-2.3.0.exe?rlkey=qb23ads42mhqjv9lobvycs0g2&dl=1">Não tem o app instalado? Baixe aqui</a>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const room = params.get('room');
    if (room) {
      const deepLink = 'gamervault://cast?room=' + encodeURIComponent(room);
      document.getElementById('launch-btn').href = deepLink;
      // Dispara o redirecionamento para o app do Windows
      window.location.href = deepLink;
    }
  </script>
</body>
</html>
